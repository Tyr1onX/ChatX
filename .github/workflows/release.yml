name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Release gate
        run: corepack pnpm release:check
      - name: Pack
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS.txt
      - name: Publish prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.tgz release/SHA256SUMS.txt --title "ChatX ${GITHUB_REF_NAME}" --generate-notes --prerelease
      - name: Publish stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.tgz release/SHA256SUMS.txt --title "ChatX ${GITHUB_REF_NAME}" --generate-notes
