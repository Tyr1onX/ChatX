name: Refresh vulnerable lockfile

on:
  push:
    branches: [docs/chinese-first-readme]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/chinese-first-readme
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Apply production audit fix
        run: corepack pnpm audit --prod --fix
      - name: Verify production audit
        run: corepack pnpm audit --prod
      - name: Remove one-off workflow
        run: rm .github/workflows/refresh-vulnerable-lock.yml
      - name: Commit lockfile refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/refresh-vulnerable-lock.yml
          git commit -m "fix: update qs to patched release"
          git push origin HEAD:docs/chinese-first-readme
