name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: corepack pnpm install --frozen-lockfile
      - name: Test
        run: corepack pnpm test
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Build
        run: corepack pnpm build
      - name: macOS browser smoke
        if: runner.os == 'macOS'
        env:
          CHATX_STATE_DIR: ${{ runner.temp }}/chatx-browser-smoke
        run: |
          node --input-type=module <<'NODE'
          import { BrowserController } from "./dist/browser/controller.js";

          const browser = new BrowserController();
          try {
            await browser.start(true);
            const result = await browser.navigate("data:text/html,<title>ChatX macOS smoke</title><h1>ok</h1>");
            if (result.title !== "ChatX macOS smoke") {
              throw new Error(`unexpected browser title: ${result.title}`);
            }
            console.log("macOS browser smoke ok");
          } finally {
            await browser.close();
          }
          NODE
      - name: Release package smoke
        run: corepack pnpm release:smoke

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          corepack pnpm@11.25.0 audit --prod --pm-on-fail=ignore 2>&1 | tee audit.log
          audit_exit=${PIPESTATUS[0]}
          set -e

          if [ "$audit_exit" -eq 0 ]; then
            echo "### Production dependency audit: PASS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -Fq '/-/npm/v1/security/advisories/bulk' audit.log \
            && grep -Eiq '(ERR_SOCKET_TIMEOUT|ETIMEDOUT|ESOCKETTIMEDOUT|ECONNRESET|ECONNREFUSED|ECONNABORTED|EAI_AGAIN|ENETUNREACH|EHOSTUNREACH|ENOTFOUND|UND_ERR_CONNECT_TIMEOUT|UND_ERR_SOCKET|error \((408|429|5[0-9]{2})\)|responded with (408|429|5[0-9]{2})| - (408|429|5[0-9]{2})([^0-9]|$))' audit.log; then
            echo '::warning title=Production dependency audit unavailable::npm registry audit service/network unavailable; no vulnerability verdict was produced.'
            {
              echo '### Production dependency audit: INFRASTRUCTURE UNAVAILABLE'
              echo 'The npm bulk advisory service did not return a vulnerability verdict. Product CI remains valid; rerun the audit when the service recovers.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "$audit_exit"
