<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatX Watcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>ChatX Watcher</h1>
    <label class="toggle">
      <input id="enabled" type="checkbox">
      <span>启用完成提醒</span>
    </label>
    <section class="status" aria-live="polite">
      <div><span>状态</span><strong id="state">读取中…</strong></div>
      <div><span>正在监听</span><strong id="watched">0 个 ChatGPT 对话</strong></div>
      <div><span>已完成</span><strong id="completed">0</strong></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
