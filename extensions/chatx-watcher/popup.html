<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatX Watcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="status-view" class="status-view">
    <h1>ChatX Watcher</h1>
    <label class="toggle">
      <input id="enabled" type="checkbox">
      <span>启用完成提醒</span>
    </label>
    <section class="status" aria-live="polite">
      <div><span>状态</span><strong id="state">读取中…</strong></div>
      <div><span>正在监听</span><strong id="watched">0 个 ChatGPT 对话</strong></div>
      <div><span>已完成</span><strong id="completed">0</strong></div>
    </section>
  </main>

  <main id="completion-view" class="completion-view" hidden>
    <header class="completion-header">
      <strong>ChatX</strong>
      <button id="dismiss" class="dismiss" type="button" aria-label="关闭">×</button>
    </header>
    <section class="completion-body" aria-live="polite">
      <pre id="character" class="character" aria-hidden="true">[._.]
 /|\
 / \</pre>
      <div class="completion-copy">
        <div id="completion-summary" class="completion-summary">ChatGPT 已完成</div>
        <div id="conversation-title" class="conversation-title">ChatGPT 对话</div>
      </div>
    </section>
    <button id="view-conversation" class="view-conversation" type="button">查看</button>
  </main>

  <script src="popup.js"></script>
</body>
</html>
